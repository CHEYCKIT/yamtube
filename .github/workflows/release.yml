name: Prepare release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # Explicit release-marked main commits publish the version in package.json.
    # Other main pushes do not trigger a release.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.draft.outputs.published }}
      ready_assets: ${{ steps.assets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Require license and recorded technical review
        run: |
          if [ ! -f LICENSE ] || [ ! -f .github/DISTRIBUTION_REVIEW.md ]; then
            echo "A project license and recorded technical review are required."
            exit 1
          fi
      - name: Resolve release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "The tag must match package.json: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Prepare draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "This version is already published; keeping its existing assets."
              exit 0
            fi
          else
            NOTES=".github/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --draft --title "LokTube ${TAG#v}" --notes-file "$NOTES" --target "$GITHUB_SHA"
            else
              gh release create "$TAG" --draft --title "LokTube ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
      - name: Reuse completed installer uploads when resuming a draft
        id: assets
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for NAME in "LokTube-$VERSION-win-x64.exe" "LokTube-$VERSION-linux-x86_64.AppImage" "LokTube-$VERSION-linux-amd64.deb"; do
            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$NAME"; then exit 0; fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Existing Windows and Linux installers verified; resuming draft without rebuilding them."

  package:
    needs: prepare
    if: needs.prepare.outputs.published != 'true' && needs.prepare.outputs.ready_assets != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack --force
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Ensure Electron runtime and license files are installed
        run: node node_modules/electron/install.js
      - name: Package and upload to draft
        run: pnpm release --x64
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: loktube-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  mac:
    needs: prepare
    if: needs.prepare.outputs.published != 'true' && vars.ENABLE_MAC_RELEASE == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack --force
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Ensure Electron runtime and license files are installed
        run: node node_modules/electron/install.js
      - name: Require signing credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
      - name: Package signed macOS release
        run: pnpm release --arm64
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [prepare, package, mac]
    if: always() && needs.prepare.outputs.published != 'true' && needs.prepare.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.prepare.outputs.ready_assets == 'true')) && (needs.mac.result == 'success' || needs.mac.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Include corresponding source and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          READY_ASSETS: ${{ needs.prepare.outputs.ready_assets }}
        run: |
          if [ "$READY_ASSETS" != "true" ]; then
            git archive --format=tar.gz --prefix="LokTube-$TAG/" HEAD -o "LokTube-$TAG-source.tar.gz"
            gh release upload "$TAG" "LokTube-$TAG-source.tar.gz" --clobber
          fi
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          with ZipFile('LokTube-Zen-UNSIGNED.xpi', 'w', ZIP_DEFLATED) as archive:
              for file in sorted(Path('browser-extension').iterdir()):
                  if file.is_file():
                      archive.write(file, file.name)
          PY
          gh release upload "$TAG" "LokTube-Zen-UNSIGNED.xpi" --clobber
      - name: Sign Zen extension with Mozilla AMO (optional)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm install --global web-ext@8
          node -e "const fs=require('node:fs');const p='browser-extension/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.version=require('./package.json').version;fs.writeFileSync(p,JSON.stringify(m,null,2));"
          web-ext sign --source-dir browser-extension --artifacts-dir firefox-signed --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          find firefox-signed -name '*.xpi' -type f -print -quit | xargs -r -I {} cp '{}' 'LokTube-Zen-signed.xpi'
          test -s 'LokTube-Zen-signed.xpi'
          gh release upload "$TAG" "LokTube-Zen-signed.xpi" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
