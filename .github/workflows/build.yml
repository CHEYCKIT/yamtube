name: Build fork installers

on:
  push:
    branches: [youtube-accounts-adblock]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack --force
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Desktop integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop
      - name: Package installers
        run: pnpm package --x64
      - name: Test packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop
        env:
          WORLDTUBE_SMOKE_APP: release/linux-unpacked/yamtube
      - name: Include source and checksums
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=YamTube-source/ HEAD -o release/YamTube-source.tar.gz
          cd release
          shopt -s nullglob
          sha256sum *.AppImage *.deb *.exe *.blockmap latest*.yml beta*.yml YamTube-source.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yamtube-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
            release/*source.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error

  stage_release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find an explicitly prepared draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.draft.outputs.tag != ''
        with:
          pattern: yamtube-*
          path: installers
      - name: Verify and stage matching build artifacts
        if: steps.draft.outputs.tag != ''
        env:
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          (cd installers/yamtube-ubuntu-latest && sha256sum -c SHA256SUMS.txt)
          (cd installers/yamtube-windows-latest && sha256sum -c SHA256SUMS.txt)
          for PLATFORM in ubuntu windows; do
            gzip -dc "installers/yamtube-$PLATFORM-latest/YamTube-source.tar.gz" > "source-$PLATFORM.tar"
            SOURCE_COMMIT=$(git get-tar-commit-id < "source-$PLATFORM.tar")
            test "$SOURCE_COMMIT" = "$GITHUB_SHA"
            rm "source-$PLATFORM.tar"
          done
          mkdir staged
          cp installers/yamtube-ubuntu-latest/*.AppImage installers/yamtube-ubuntu-latest/*.deb installers/yamtube-ubuntu-latest/latest-linux.yml staged/
          cp installers/yamtube-windows-latest/*.exe installers/yamtube-windows-latest/*.blockmap installers/yamtube-windows-latest/latest.yml staged/
          cp installers/yamtube-ubuntu-latest/YamTube-source.tar.gz "staged/YamTube-$VERSION-source.tar.gz"
          cp staged/latest.yml staged/beta.yml
          cp staged/latest-linux.yml staged/beta-linux.yml
          printf 'Source commit: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > staged/BUILDINFO.txt
          (cd staged && sha256sum *.AppImage *.deb *.exe *.blockmap *.yml *source.tar.gz BUILDINFO.txt > SHA256SUMS.txt)
      - name: Upload to the prepared draft without publishing
        if: steps.draft.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.draft.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" staged/* --clobber
